dependencies = [
    "academy-py>=1.0",
    "psutil>=7.2.2",
    "redis>=5",
]

[dependency-groups]
dev = [
    "py-spy>=0.4.3",
]

[tool.uv.sources]
academy-py = { git = "https://github.com/yadudoc/academy.git", branch = "redis-scale" }
